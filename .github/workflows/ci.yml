name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - docs/**
      - "**/*.md"
  push:
    branches: [master]
    paths-ignore:
      - docs/**
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    name: Validate GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  lockfile:
    name: Validate lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check dependency lockfile
        run: uv lock --check

  formatting:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

  lint:
    name: Lint Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run Ruff
        run: uv run ruff check .

  typecheck:
    name: Type-check Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run mypy
        run: uv run mypy .

  python-3-14-compatibility:
    name: Python 3.14 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run compatibility tests
        run: uv run pytest

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit --junitxml=test-results/unit.xml

      - name: Upload unit-test report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-report
          path: test-results/unit.xml
          if-no-files-found: warn
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run integration tests
        run: uv run pytest tests/integration --junitxml=test-results/integration.xml

      - name: Upload integration-test report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-report
          path: test-results/integration.xml
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Enforce test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Measure and enforce coverage
        run: >-
          uv run pytest --cov=backend --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  unity-package:
    name: Validate Unity package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The Unity release whose assemblies the package is compiled against. Bumping this invalidates
      # the assembly cache below, which is the only step that pays for the multi-gigabyte image.
      UNITY_IMAGE: unityci/editor:ubuntu-6000.6.0f1-base-3
      UNITY_MANAGED_DIR: ${{ github.workspace }}/.unity-managed
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate package and assembly definitions
        run: |
          jq -e '
            .name == "com.visora.editor" and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.unity | test("^(20[0-9]{2}|[0-9]{4,})\\.[0-9]+$"))
          ' unity-package/package.json > /dev/null
          jq -e . unity-package/Editor/Visora.Editor.asmdef > /dev/null
          jq -e . unity-package/Tests/Editor/Visora.Editor.Tests.asmdef > /dev/null
          test -f unity-package/README.md
          test -f unity-package/CHANGELOG.md

      # Unity does not publish UnityEngine/UnityEditor to NuGet and its assemblies may not be
      # redistributed, so they are extracted from the official editor image at build time. Only the
      # ~140 MB Managed directory is kept; no Unity licence is involved because the editor is never
      # run - the assemblies are only referenced by the compiler.
      - name: Restore cached Unity assemblies
        id: unity-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UNITY_MANAGED_DIR }}
          key: unity-managed-${{ env.UNITY_IMAGE }}

      - name: Extract Unity assemblies from the editor image
        if: steps.unity-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "$UNITY_IMAGE"
          mkdir -p "$UNITY_MANAGED_DIR"
          # The install path differs between editor image variants, so the Managed directory is
          # located by finding UnityEditor.dll rather than assumed to sit at a fixed path.
          docker run --rm -v "$UNITY_MANAGED_DIR:/out" --entrypoint sh "$UNITY_IMAGE" -c '
            set -eu
            editor_dll="$(find / -maxdepth 9 -type f -name UnityEditor.dll -path "*/Managed/*" -print -quit)"
            if [ -z "$editor_dll" ]; then
              echo "UnityEditor.dll was not found in the editor image" >&2
              exit 1
            fi
            cp -r "$(dirname "$editor_dll")/." /out/
            chmod -R a+rX /out
          '

      - name: Verify extracted assemblies
        run: |
          test -f "$UNITY_MANAGED_DIR/UnityEditor.dll"
          test -f "$UNITY_MANAGED_DIR/UnityEngine.dll"
          test -d "$UNITY_MANAGED_DIR/UnityEngine"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Compiles the package the way Unity would. A parse-only check was measured against two real
      # defects in this package (a yield inside a catch clause, and a call to an API that is internal
      # in Unity 6) and caught neither: both are semantic, so real assemblies are required.
      - name: Compile and format-check Unity package
        run: >-
          uv run --no-project python scripts/check_unity_package.py
          --unity-managed-dir "$UNITY_MANAGED_DIR" --format

  docker:
    name: Build and smoke-test container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --pull --tag visora:ci .

      - name: Verify hardened runtime starts
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --cap-drop=ALL --security-opt=no-new-privileges
          --entrypoint /app/.venv/bin/python visora:ci
          -c 'from backend.config import get_settings; assert get_settings().asset_cache_dir == "/data/cache"'

  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution integrity
        run: |
          uv run --extra dev twine check dist/*
          uv run python scripts/validate_distribution.py

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7
