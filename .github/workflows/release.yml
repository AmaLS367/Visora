name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the project version, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify-and-build:
    name: Verify and build release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.release-tag.outputs.value }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "value=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.value }}
        run: |
          PROJECT_VERSION="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$PROJECT_VERSION"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run release verification
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run pytest

      - name: Validate Unity package
        run: |
          jq -e '
            .name == "com.visora.editor" and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.unity | test("^20[0-9]{2}\\.[0-9]+$"))
          ' unity-package/package.json > /dev/null
          jq -e . unity-package/Editor/Visora.Editor.asmdef > /dev/null
          jq -e . unity-package/Tests/Editor/Visora.Editor.Tests.asmdef > /dev/null

      - name: Build wheel and source distribution
        run: uv build

      - name: Upload release distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/visora/
    steps:
      - name: Download release distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distribution
          path: dist/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  create-github-release:
    name: Create GitHub release
    needs: [verify-and-build, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distribution
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.verify-and-build.outputs.release_tag }}
          generate_release_notes: true
          files: dist/*
