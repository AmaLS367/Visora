name: Bug report
description: Report a reproducible problem in Visora or its Unity bridge integration.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Visora. Please remove credentials, Unity project assets, and other sensitive information before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the actual behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
      description: Include the MCP tool call, bridge mode, and smallest Unity setup that reproduces the issue.
      placeholder: |
        1. Start Unity with ...
        2. Configure ...
        3. Call ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Visora version, Python version, OS, Unity version, and bridge mode/version.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, private URLs, and proprietary Unity project data.
      render: text
