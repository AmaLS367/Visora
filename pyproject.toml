[project]
name = "visora"
version = "0.1.2"
description = "A high-level MCP wrapper over an existing Unity Editor HTTP bridge"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ama" }]
keywords = ["ai-agents", "mcp", "model-context-protocol", "unity", "unity-editor", "3d", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=12.2.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
]

[project.urls]
Documentation = "https://github.com/AmaLS367/Visora/blob/master/docs/SETUP_GUIDE.md"
Changelog = "https://github.com/AmaLS367/Visora/blob/master/docs/CHANGELOG.md"
Issues = "https://github.com/AmaLS367/Visora/issues"
Repository = "https://github.com/AmaLS367/Visora"

[project.scripts]
visora = "backend.server:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "twine>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "COM", "C4", "PT", "ARG", "PTH", "TD", "ERA", "PL", "RUF"]
ignore = ["E402", "F401", "UP035", "PLR2004", "PLR0917", "E501", "ARG001", "COM812"] # Ignore late import, unused, type deprecation, magic value, positional argument count, line-length, unused argument warnings, and formatter-conflicting trailing comma lint

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["build", "dist"]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["backend"]

