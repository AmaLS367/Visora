[project]
name = "visora"
version = "0.1.0"
description = "A high-level MCP wrapper over an existing Unity Editor HTTP bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=12.2.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
visora = "backend.server:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "COM", "C4", "PT", "ARG", "PTH", "TD", "ERA", "PL", "RUF"]
ignore = ["E402", "F401", "UP035", "PLR2004", "E501", "ARG001", "COM812"] # Ignore late import, unused, type deprecation, magic value, line-length, unused argument warnings, and formatter-conflicting trailing comma lint

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["build", "dist"]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["backend"]
