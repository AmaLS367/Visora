services:
  visora:
    build:
      context: .
      target: runtime
    image: visora:0.1.2
    init: true
    stdin_open: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      ASSET_CACHE_DIR: /data/cache
      UNITY_BRIDGE_URL: ${UNITY_BRIDGE_URL:-http://host.docker.internal}
      UNITY_BRIDGE_PORT: ${UNITY_BRIDGE_PORT:-7890}
      UNITY_BRIDGE_FALLBACK_PORT: ${UNITY_BRIDGE_FALLBACK_PORT:-7891}
      UNITY_BRIDGE_PORTS_TO_SCAN: ${UNITY_BRIDGE_PORTS_TO_SCAN:-7890,7891,7892,7893}
      UNITY_BRIDGE_TIMEOUT_SECONDS: ${UNITY_BRIDGE_TIMEOUT_SECONDS:-10}
      UNITY_BRIDGE_PING_TIMEOUT_SECONDS: ${UNITY_BRIDGE_PING_TIMEOUT_SECONDS:-2}
      UNITY_BRIDGE_EXECUTION_TIMEOUT_SECONDS: ${UNITY_BRIDGE_EXECUTION_TIMEOUT_SECONDS:-60}
      UNITY_BRIDGE_MAX_RETRIES: ${UNITY_BRIDGE_MAX_RETRIES:-2}
      UNITY_BRIDGE_RETRY_BACKOFF: ${UNITY_BRIDGE_RETRY_BACKOFF:-0.5}
      UNITY_BRIDGE_MODE: ${UNITY_BRIDGE_MODE:-legacy}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SKETCHFAB_API_TOKEN: ${SKETCHFAB_API_TOKEN:-}
      POLY_PIZZA_API_KEY: ${POLY_PIZZA_API_KEY:-}
      DEFAULT_ASSET_IMPORT_DIR: ${DEFAULT_ASSET_IMPORT_DIR:-Assets/VisoraDownloads}
      ASSET_DOWNLOAD_TIMEOUT_SECONDS: ${ASSET_DOWNLOAD_TIMEOUT_SECONDS:-120}
      MAX_ASSET_DOWNLOAD_SIZE_BYTES: ${MAX_ASSET_DOWNLOAD_SIZE_BYTES:-250000000}
      MAX_ASSET_ARCHIVE_ENTRIES: ${MAX_ASSET_ARCHIVE_ENTRIES:-10000}
      MAX_ASSET_ARCHIVE_UNCOMPRESSED_SIZE_BYTES: ${MAX_ASSET_ARCHIVE_UNCOMPRESSED_SIZE_BYTES:-1000000000}
      MAX_ASSET_ARCHIVE_ENTRY_SIZE_BYTES: ${MAX_ASSET_ARCHIVE_ENTRY_SIZE_BYTES:-250000000}
      MAX_ASSET_ARCHIVE_COMPRESSION_RATIO: ${MAX_ASSET_ARCHIVE_COMPRESSION_RATIO:-100}
      SEARXNG_INSTANCE_URLS: ${SEARXNG_INSTANCE_URLS:-https://searx.be,https://searx.tiekoetter.com,https://priv.au}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-10}
    volumes:
      - visora-cache:/data/cache

volumes:
  visora-cache:
